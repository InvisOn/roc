on:
  workflow_call:

name: Cross Compilation Test

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  # Cross-compile all fx platform tests from all host platforms
  roc-cross-compile:
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [
            ubuntu-24.04, # Linux x64 host
            macos-15-intel, # macOS x64 host
            macos-15, # macOS ARM64 host
            windows-2022, # Windows x64 host
          ]
        target: [
            x64musl, # Linux x86_64 musl (static linking)
            arm64musl, # Linux ARM64 musl (static linking)
            arm32musl, # Linux ARM32 musl (static linking), dev backend
          ]
    # The arm32 lane builds with the dev backend (`--opt=dev`); the other lanes
    # use roc build's default. The flags are inlined as expressions so every
    # host shell (bash and PowerShell) sees the same argv.
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.16.0
          use-cache: true

      - name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          # See ci_zig.yml: cache Zig's fetched-package subdir under a stable
          # build.zig.zon key so a cold runner doesn't re-download deps and hit
          # transient HttpConnectionClosing fetch failures.
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: TheMrMilchmann/setup-msvc-dev@79dac248aac9d0059f86eae9d8b5bfab4e95e97c  # ratchet:TheMrMilchmann/setup-msvc-dev@v4.0.0
        with:
          arch: x64

      - name: Build roc compiler
        uses: ./.github/actions/flaky-retry
        with:
          command: zig build
          retry_count: 3

      - name: Run fx platform cross-compilation tests
        run: |
          echo "Cross-compiling fx tests from ${{ matrix.host }} to ${{ matrix.target }}"
          zig build run-test-cli -- --suite platforms --filter test/fx/ --cross-target=${{ matrix.target }} ${{ matrix.target == 'arm32musl' && '--cross-opt=dev' || '' }}

      - name: Cross-compile int platform test app (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "Cross-compiling int platform from ${{ matrix.host }} to ${{ matrix.target }}"
          ./zig-out/bin/roc build --target=${{ matrix.target }} ${{ matrix.target == 'arm32musl' && '--opt=dev' || '' }} --output=int_app_${{ matrix.target }}_${{ matrix.host }} test/int/app.roc

      # arm32 glibc (arm32linux) cross builds need a Linux host; the
      # executable needs the target's /lib/ld-linux-armhf.so.3 to run, so this
      # lane only builds it.
      - name: Cross-compile int platform test app for arm32linux (glibc)
        if: matrix.target == 'arm32musl' && runner.os == 'Linux'
        run: |
          zig build run-test-cli -- --suite platforms --filter test/int/ --cross-target=arm32linux --cross-opt=dev
          ./zig-out/bin/roc build --target=arm32linux --opt=dev --output=int_app_arm32linux_${{ matrix.host }} test/int/app.roc

      - name: Cross-compile int platform test app (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "Cross-compiling int platform from ${{ matrix.host }} to ${{ matrix.target }}"
          zig-out\bin\roc.exe build --target=${{ matrix.target }} ${{ matrix.target == 'arm32musl' && '--opt=dev' || '' }} --output=int_app_${{ matrix.target }}_${{ matrix.host }} test/int/app.roc

      - name: Upload cross-compiled int app executables
        uses: actions/upload-artifact@v7.0.1 # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: cross-compiled-${{ matrix.host }}-${{ matrix.target }}
          path: |
            int_app_${{ matrix.target }}_*
          retention-days: 1

  # Test cross-compiled int platform executables on actual target platforms
  test-int-on-target:
    needs: [roc-cross-compile]
    runs-on: ${{ matrix.target_os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Test x64musl executables on Linux x64
          - target: x64musl
            target_os: ubuntu-24.04
            arch: x64
          # Test arm64musl executables on Linux ARM64
          - target: arm64musl
            target_os: ubuntu-24.04-arm
            arch: arm64
          # Test arm32musl executables under qemu on the dev backend's CPU
          # floor. cortex-a9 is ARMv7-A with NEON and VFPv3-D32 and without
          # integer divide, so an instruction above the floor (SDIV/UDIV,
          # VFPv4) raises SIGILL instead of running silently. Every arm32
          # app must also print what the x64musl app built on the Linux host
          # prints (J3c of projects/big/arm32-dev-backend.md), apart from the
          # heap addresses the app prints, which differ between any two runs.
          - target: arm32musl
            target_os: ubuntu-24.04
            arch: arm32
            run_prefix: qemu-arm-static -cpu cortex-a9
            reference_app: int_app_x64musl_ubuntu-24.04
    steps:
      - name: Install qemu (arm32)
        if: matrix.target == 'arm32musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
          qemu-arm-static -cpu help | grep -E '^ *cortex-a9$'

      - name: Download all cross-compiled artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: cross-compiled-*-${{ matrix.target }}
          merge-multiple: true

      - name: Download the reference app
        if: matrix.reference_app
        uses: actions/download-artifact@v8.0.1
        with:
          name: cross-compiled-ubuntu-24.04-x64musl

      - name: List downloaded files
        run: |
          echo "Downloaded cross-compiled executables:"
          ls -la *_${{ matrix.target }}* || echo "No files found"

      - name: Test cross-compiled executables from all hosts
        run: |
          success_count=0
          total_count=0

          echo "Testing ${{ matrix.target }} executables on ${{ matrix.target_os }} (${{ matrix.arch }})"

          reference_app="${{ matrix.reference_app }}"
          if [ -n "$reference_app" ]; then
            chmod +x "$reference_app"
            ./"$reference_app" | sed -E 's/0x[0-9a-f]+/0xADDRESS/g' > expected_stdout.txt
          fi

          # Test int apps from all host platforms
          for int_app in int_app_${{ matrix.target }}_*; do
            if [ -f "$int_app" ]; then
              echo ""
              echo "Testing $int_app:"
              chmod +x "$int_app"
              if ${{ matrix.run_prefix }} ./"$int_app" > actual_stdout.txt; then
                cat actual_stdout.txt
                if [ -n "$reference_app" ] && ! diff -u expected_stdout.txt <(sed -E 's/0x[0-9a-f]+/0xADDRESS/g' actual_stdout.txt); then
                  echo "❌ $int_app: stdout differs from $reference_app"
                else
                  echo "✅ $int_app: SUCCESS"
                  success_count=$((success_count + 1))
                fi
              else
                cat actual_stdout.txt
                echo "❌ $int_app: FAILED"
              fi
              total_count=$((total_count + 1))
            fi
          done

          echo ""
          echo "Summary: $success_count/$total_count executables passed"

          if [ $success_count -eq $total_count ] && [ $total_count -gt 0 ]; then
            echo "🎉 All cross-compiled executables work correctly!"
          else
            echo "💥 Some cross-compiled executables failed"
            exit 1
          fi
